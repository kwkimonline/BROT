[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brot-ot"
version = "0.1.0"
description = "Deep Barycentric Regression for Optimal Transport Map Estimation (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kunwoong Kim", email = "kwkim.online@gmail.com"}]
license = {text = "MIT"}
dependencies = ["torch>=2.0", "numpy>=1.24", "scipy>=1.10", "POT>=0.9.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["brot*"]
